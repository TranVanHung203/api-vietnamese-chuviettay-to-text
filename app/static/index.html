<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VietOCR Handwriting Test</title>
    <style>
      :root {
        --bg-1: #f4f1ea;
        --bg-2: #dde8f8;
        --surface: #fffdf8;
        --ink: #1d2733;
        --muted: #60758a;
        --accent: #1d6fd8;
        --accent-strong: #1454a5;
        --line: #d4dee8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 500px at 8% -20%, #ffe1b8 0%, transparent 70%),
          radial-gradient(800px 380px at 100% 0%, #c7dcff 0%, transparent 70%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .wrap {
        max-width: 980px;
        margin: 28px auto;
        padding: 0 16px 24px;
      }

      .panel {
        background: color-mix(in srgb, var(--surface) 90%, #ffffff 10%);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 14px 42px rgba(21, 52, 84, 0.14);
        overflow: hidden;
      }

      .top {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(135deg, #ffffff, #f7fbff);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.2rem;
        letter-spacing: 0.2px;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 14px;
        padding: 14px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: #fff;
      }

      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin-bottom: 10px;
      }

      .toolbar label {
        font-size: 0.92rem;
        color: #2f4a63;
      }

      .toolbar input[type="range"] {
        width: 130px;
      }

      .canvas-box {
        border: 2px dashed #94b3d2;
        border-radius: 12px;
        padding: 8px;
        background:
          linear-gradient(transparent 31px, #edf3fa 32px),
          linear-gradient(90deg, transparent 31px, #edf3fa 32px);
        background-size: 32px 32px;
      }

      canvas {
        display: block;
        width: 100%;
        height: 340px;
        border-radius: 8px;
        border: 1px solid #b9cde2;
        background: #ffffff;
        touch-action: none;
        cursor: crosshair;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.93rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
      }

      button:active {
        transform: translateY(1px);
      }

      .btn-primary {
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        box-shadow: 0 8px 20px rgba(29, 111, 216, 0.3);
      }

      .btn-soft {
        color: #17324f;
        background: #e8f1fc;
      }

      .btn-danger {
        color: #6b1b25;
        background: #fde7ea;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.92rem;
        border: 1px solid #d6e1ed;
        background: #f6fbff;
        color: #20435f;
      }

      .status.error {
        border-color: #f0b7c0;
        background: #fff2f4;
        color: #7e2132;
      }

      .meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 10px 0;
      }

      .pill {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fafcff;
      }

      .pill .k {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .pill .v {
        margin-top: 4px;
        font-weight: 700;
        font-size: 0.95rem;
      }

      textarea {
        width: 100%;
        min-height: 168px;
        resize: vertical;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        font: 500 1rem/1.5 "Consolas", "Cascadia Code", monospace;
        color: #24374d;
        background: #fcfeff;
      }

      .preview-box {
        margin-top: 10px;
      }

      .preview-box img {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="top">
          <h1>Test Chữ Viết Tay -> Text (VietOCR)</h1>
          <p class="hint">Viết bằng chuột hoặc bút cảm ứng vào khung bên trái, rồi bấm nhận diện.</p>
        </div>

        <div class="grid">
          <section class="card">
            <div class="toolbar">
              <label for="pen-size">
                Nét bút:
                <input id="pen-size" type="range" min="1" max="20" step="1" value="4" />
              </label>
              <label for="multiline-enabled">
                <input id="multiline-enabled" type="checkbox" checked />
                Nhận diện nhiều dòng
              </label>
              <label for="number-word-mode">
                <input id="number-word-mode" type="checkbox" />
                Ưu tiên từ đọc số
              </label>
              <label for="number-digit-mode">
                <input id="number-digit-mode" type="checkbox" checked />
                Ưu tiên chữ số 0-9
              </label>
              <label for="crop-enabled">
                <input id="crop-enabled" type="checkbox" checked />
                Cắt vùng chữ trước khi gửi
              </label>
            </div>

            <div class="canvas-box">
              <canvas id="pad" aria-label="Handwriting pad"></canvas>
            </div>

            <div class="actions">
              <button class="btn-primary" id="btn-detect" type="button">Nhận Diện</button>
              <button class="btn-soft" id="btn-clear" type="button">Xóa Bảng</button>
            </div>

            <div id="status" class="status">Sẵn sàng.</div>
          </section>

          <section class="card">
            <div class="meta">
              <div class="pill">
                <div class="k">Model</div>
                <div class="v" id="meta-model">-</div>
              </div>
              <div class="pill">
                <div class="k">Device</div>
                <div class="v" id="meta-device">-</div>
              </div>
            </div>

            <label for="result">Kết quả nhận diện:</label>
            <textarea id="result" placeholder="Kết quả sẽ hiển thị ở đây..."></textarea>

            <div class="preview-box">
              <label>Ảnh gửi lên API:</label>
              <img id="preview" alt="Cropped preview sent to API" />
            </div>
          </section>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("pad");
      const ctx = canvas.getContext("2d");
      const penSizeInput = document.getElementById("pen-size");
      const multilineEnabledInput = document.getElementById("multiline-enabled");
      const numberWordModeInput = document.getElementById("number-word-mode");
      const numberDigitModeInput = document.getElementById("number-digit-mode");
      const cropEnabledInput = document.getElementById("crop-enabled");
      const btnDetect = document.getElementById("btn-detect");
      const btnClear = document.getElementById("btn-clear");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const metaModelEl = document.getElementById("meta-model");
      const metaDeviceEl = document.getElementById("meta-device");
      const previewEl = document.getElementById("preview");

      let isDrawing = false;
      let hasInk = false;
      let dpr = window.devicePixelRatio || 1;
      let lastX = 0;
      let lastY = 0;

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.classList.toggle("error", isError);
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        resetCanvas(false);
      }

      function resetCanvas(resetResult = true) {
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, rect.width, rect.height);
        hasInk = false;

        if (resetResult) {
          resultEl.value = "";
          metaModelEl.textContent = "-";
          metaDeviceEl.textContent = "-";
          previewEl.style.display = "none";
          previewEl.removeAttribute("src");
          setStatus("Đã xóa bảng.");
        }
      }

      function getCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top,
        };
      }

      function startDraw(event) {
        const p = getCanvasPoint(event);
        isDrawing = true;
        lastX = p.x;
        lastY = p.y;
      }

      function draw(event) {
        if (!isDrawing) return;
        const p = getCanvasPoint(event);
        ctx.strokeStyle = "#111111";
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.lineWidth = Number(penSizeInput.value);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x;
        lastY = p.y;
        hasInk = true;
      }

      function endDraw() {
        isDrawing = false;
      }

      function cropCanvasToInk(sourceCanvas, threshold = 245, margin = 14) {
        const srcCtx = sourceCanvas.getContext("2d");
        const data = srcCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data;

        let minX = sourceCanvas.width;
        let minY = sourceCanvas.height;
        let maxX = -1;
        let maxY = -1;

        for (let y = 0; y < sourceCanvas.height; y++) {
          for (let x = 0; x < sourceCanvas.width; x++) {
            const idx = (y * sourceCanvas.width + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];
            if (r < threshold || g < threshold || b < threshold) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (maxX < minX || maxY < minY) {
          return sourceCanvas;
        }

        minX = Math.max(0, minX - margin);
        minY = Math.max(0, minY - margin);
        maxX = Math.min(sourceCanvas.width - 1, maxX + margin);
        maxY = Math.min(sourceCanvas.height - 1, maxY + margin);

        const cropW = maxX - minX + 1;
        const cropH = maxY - minY + 1;
        const out = document.createElement("canvas");
        out.width = cropW;
        out.height = cropH;
        const outCtx = out.getContext("2d");
        outCtx.fillStyle = "#ffffff";
        outCtx.fillRect(0, 0, cropW, cropH);
        outCtx.drawImage(sourceCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
        return out;
      }

      function getExportDataUrl() {
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = canvas.width;
        exportCanvas.height = canvas.height;
        exportCanvas.getContext("2d").drawImage(canvas, 0, 0);

        const finalCanvas = cropEnabledInput.checked
          ? cropCanvasToInk(exportCanvas)
          : exportCanvas;

        return finalCanvas.toDataURL("image/png");
      }

      async function detectText() {
        if (!hasInk) {
          setStatus("Bạn chưa viết gì trên bảng.", true);
          return;
        }

        setStatus("Đang gửi ảnh lên API...");
        btnDetect.disabled = true;

        try {
          const imageBase64 = getExportDataUrl();
          previewEl.src = imageBase64;
          previewEl.style.display = "block";

          const response = await fetch("/ocr/base64", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image_base64: imageBase64,
              return_prob: false,
              multiline: multilineEnabledInput.checked,
              number_word_mode: numberWordModeInput.checked,
              number_digit_mode: numberDigitModeInput.checked,
            }),
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || "OCR request failed");
          }

          if (Array.isArray(payload.lines) && payload.lines.length > 1) {
            resultEl.value = payload.lines.join("\n");
          } else {
            resultEl.value = payload.text || "";
          }
          metaModelEl.textContent = payload.model || "-";
          metaDeviceEl.textContent = payload.device || "-";
          if (payload.number_digit_mode && payload.raw_text) {
            setStatus("Nhận diện xong (đã ưu tiên chuẩn hóa về chữ số 0-9).");
          } else if (payload.number_word_mode && payload.raw_text) {
            setStatus("Nhận diện xong (đã chuẩn hóa theo từ điển số).");
          } else {
            setStatus("Nhận diện xong.");
          }
        } catch (err) {
          setStatus(`Lỗi: ${err.message}`, true);
        } finally {
          btnDetect.disabled = false;
        }
      }

      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture(event.pointerId);
        startDraw(event);
      });
      canvas.addEventListener("pointermove", draw);
      canvas.addEventListener("pointerup", endDraw);
      canvas.addEventListener("pointercancel", endDraw);
      canvas.addEventListener("pointerleave", endDraw);

      btnClear.addEventListener("click", () => resetCanvas(true));
      btnDetect.addEventListener("click", detectText);
      numberWordModeInput.addEventListener("change", () => {
        if (numberWordModeInput.checked) {
          numberDigitModeInput.checked = false;
        }
      });
      numberDigitModeInput.addEventListener("change", () => {
        if (numberDigitModeInput.checked) {
          numberWordModeInput.checked = false;
        }
      });
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      setStatus("Sẵn sàng.");
    </script>
  </body>
</html>
